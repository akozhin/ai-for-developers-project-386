# Blueprint Render (ADR-004): веб-сервис из Dockerfile и бесплатная БД Postgres.
# Секреты (например, AI_API_KEY) задаются в панели Render, а не в репозитории.
databases:
  - name: cal-db
    plan: free
    region: frankfurt
    databaseName: cal
    user: cal

services:
  - type: web
    name: cal-app
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cal-db
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SEED_ON_START
        value: "true"
