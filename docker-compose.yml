services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cal}
      POSTGRES_DB: ${POSTGRES_DB:-cal}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cal}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
